          example: 2026-08-13T04:25:24.371948Z
    WikiPageSourceDoc:
      type: object
      description: Wiki 페이지의 근거가 된 원본 문서
      properties:
        confidence:
          type: number
          format: double
          description: 관계 신뢰도(0~1)
          example: 0.87
        filename:
          type: string
          description: 문서 파일명
          example: 설계문서.pdf
        id:
          type: string
          description: 문서 ID
          example: doc_1b9f4c7e2a8d4f1e6c3b0a97d25e4f83
        relation_type:
          type: string
          description: 문서와 페이지의 관계 종류
        source_uri:
          type: string
          description: 원본 파일이 저장된 오브젝트 스토리지 경로
    WikiRelatedPage:
      type: object
      description: 그래프에서 이어진 관련 Wiki 페이지
      properties:
        confidence:
          type: number
          format: double
          description: 관계 신뢰도(0~1)
          example: 0.87
        id:
          type: string
          description: Wiki 페이지 ID
        label:
          type: string
          description: 관계를 설명하는 짧은 문구
        link_type:
          type: string
          description: 관계 종류
          example: related
        page_type:
          type: string
          description: 페이지 종류
          example: Concept
        slug:
          type: string
          description: URL에 쓰는 식별자
          example: inverted-index
        title:
          type: string
          description: 페이지 제목
          example: 역색인
    WikiSchemaDraftRequest:
      type: object
      description: Wiki 스키마 초안 생성 요청
      properties:
        name:
          type: string
          description: 초안 이름. 생략하면 서버가 붙인다.
          example: 설계 문서 스키마
        rawMarkdown:
          type: string
          description: 스키마를 뽑아낼 원본 Markdown
          example: |-
            # 설계

            ## 구성요소
          minLength: 1
      required:
      - rawMarkdown
    WikiSchemaDraftResponse:
      type: object
      description: 초안 생성 결과
      properties:
        wiki_schema:
          $ref: "#/components/schemas/WikiSchemaResponse"
          description: 생성된 스키마 초안
      required:
      - wiki_schema
    WikiSchemaFragmentsResponse:
      type: object
      description: 스키마를 쓰이는 곳별로 쪼갠 조각. 각 조각이 해당 단계의 프롬프트에 들어간다.
      properties:
        concept_markdown:
          type: string
          description: Concept 페이지 작성 규칙
        edit_markdown:
          type: string
          description: 편집 단계에만 적용되는 규칙
        global_markdown:
          type: string
          description: 모든 단계에 공통으로 들어가는 규칙
        ingest_markdown:
          type: string
          description: 문서 ingest 단계에만 적용되는 규칙
        query_markdown:
          type: string
          description: 질의 단계에만 적용되는 규칙
        template_markdown:
          type: string
          description: 페이지 템플릿 정의
      required:
      - concept_markdown
      - edit_markdown
      - global_markdown
      - ingest_markdown
      - query_markdown
      - template_markdown
    WikiSchemaIssueResponse:
      type: object
      description: 스키마 해석 중 발견한 문제 하나
      properties:
        category:
          type: string
          description: 문제 분류
        reason:
          type: string
          description: 왜 문제인지에 대한 설명
        section:
          type: string
          description: 문제가 발견된 섹션 이름. 특정할 수 없으면 null이다.
        severity:
          type: string
          description: 심각도. blocked면 활성화할 수 없고 unclear는 경고다.
          enum:
          - blocked
          - unclear
          example: unclear
        text:
          type: string
          description: 문제가 된 원문 구절
      required:
      - category
      - reason
      - severity
      - text
    WikiSchemaPreviewRequest:
      type: object
      description: Wiki 스키마 미리보기 요청. 저장하지 않고 결과만 돌려준다.
      properties:
        rawMarkdown:
          type: string
          description: 스키마를 뽑아낼 원본 Markdown
          example: |-
            # 설계

            ## 구성요소
          minLength: 1
      required:
      - rawMarkdown
    WikiSchemaPreviewResponse:
      type: object
      description: 저장하지 않고 스키마 해석 결과만 보여주는 응답
      properties:
        fragments:
          $ref: "#/components/schemas/WikiSchemaFragmentsResponse"
          description: 용도별로 쪼갠 스키마 조각
        has_blocked_issues:
          type: boolean
          description: 활성화를 막는 blocked 문제가 있는지 여부
          example: false
        issues:
          type: array
          description: 해석 중 발견한 문제 목록
          items:
            $ref: "#/components/schemas/WikiSchemaIssueResponse"
        preview_markdown:
          type: string
          description: 해석 결과를 사람이 읽도록 정리한 Markdown
      required:
      - fragments
      - has_blocked_issues
      - issues
      - preview_markdown
    WikiSchemaResponse:
      type: object
      description: Wiki 스키마 하나. 활성화되면 Wiki 생성·질의에 쓰인다.
      properties:
        activated_at:
          type: string
          description: 활성화된 시각(ISO-8601 UTC). 활성화 전이면 null이다.
        created_at:
          type: string
          description: 생성 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        fragments:
          $ref: "#/components/schemas/WikiSchemaFragmentsResponse"
          description: 용도별로 쪼갠 스키마 조각
        has_blocked_issues:
          type: boolean
          description: 활성화를 막는 blocked 문제가 있는지 여부
          example: false
        id:
          type: string
          description: 스키마 ID
        issues:
          type: array
          description: 해석 중 발견한 문제 목록
          items:
            $ref: "#/components/schemas/WikiSchemaIssueResponse"
        name:
          type: string
          description: 스키마 이름
          example: 설계 문서 스키마
        preview_markdown:
          type: string
          description: 해석 결과를 사람이 읽도록 정리한 Markdown
        raw_markdown:
          type: string
          description: 입력으로 준 원본 Markdown
        schema_version:
          type: string
          description: 스키마 형식 버전
          example: v1
        status:
          type: string
          description: 스키마 상태
          example: draft
        updated_at:
          type: string
          description: 마지막 변경 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        user_id:
          type: string
          description: 초안을 만든 사용자 ID
          example: user_3f1c8a6b52d7411e9c04ab5d2e7f6081
        workspace_id:
          type: string
          description: 이 스키마가 속한 워크스페이스 ID
          example: ws_9d47a0e9a6324341b47562553b75f92a
      required:
      - fragments
      - has_blocked_issues
      - id
      - issues
      - name
      - preview_markdown
      - raw_markdown
      - schema_version
      - status
      - user_id
      - workspace_id
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      name: bearerAuth
      scheme: bearer
      type: http
