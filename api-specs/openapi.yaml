components:
  schemas:
    Actor:
      type: object
      properties:
        user_id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
      required:
      - user_id
      - workspace_id
    AgentRunApproveRequest:
      type: object
      description: Agent 편집안 승인 요청. 정의되지 않은 필드가 있으면 거절된다.
      properties:
        operation_hash:
          type: string
          description: 승인 대상 편집안의 해시(64자). 내용이 바뀌면 값이 달라져 잘못된 승인을 막는다.
          maxLength: 64
          minLength: 64
        plan_version:
          type: integer
          format: int32
          description: 승인 대상 plan의 버전. 서버 값과 다르면 거절된다.
          example: 1
          minimum: 1
      required:
      - operation_hash
    AgentRunReviseRequest:
      type: object
      description: Agent 편집안 수정 요청. 정의되지 않은 필드가 있으면 거절된다.
      properties:
        instruction:
          type: string
          description: 어떻게 고칠지 알려주는 지시문(1000자 이하)
          example: 표를 목록으로 바꿔줘
          maxLength: 1000
          minLength: 0
      required:
      - instruction
    AgentToolExecuteRequest:
      type: object
      properties:
        arguments:
          $ref: "#/components/schemas/JsonNode"
        idempotency_key:
          type: string
          minLength: 1
        operation_hash:
          type: string
          maxLength: 64
          minLength: 64
        operation_id:
          type: string
          minLength: 1
        plan_id:
          type: string
          minLength: 1
        plan_version:
          type: integer
          format: int32
        run_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
      required:
      - arguments
      - idempotency_key
      - operation_hash
      - operation_id
      - plan_id
      - run_id
      - user_id
      - workspace_id
    AgentToolReadRequest:
      type: object
      properties:
        arguments:
          $ref: "#/components/schemas/JsonNode"
        run_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
      required:
      - arguments
      - run_id
      - user_id
      - workspace_id
    AgentTurnRequest:
      type: object
      description: "Agent turn 요청. 접수되면 202로 돌아오고 결과는 비동기로 만들어진다. 문서를 열지 않은 상태에서도 보낼 수 있으며, 그때는 편집 대신 답변·되물음만 나온다. skill_* 필드는 snake_case이고 나머지는 camelCase다."
      properties:
        allow_web_search:
          type: boolean
          description: AI가 질의로 판정했을 때 웹 검색을 허용할지. 생략하면 내부 문서만 사용한다. 편집·Skill 갈래에는 영향이 없다.
        baseVersion:
          type: integer
          format: int64
          description: 편집 기준으로 삼을 문서 버전. documentId와 함께 생략한다.
          example: 3
          minimum: 0
        conversationContext:
          $ref: "#/components/schemas/ConversationContext"
          description: 이전 대화 맥락. 있으면 편집 판단에 함께 쓴다.
        documentId:
          type: string
          description: 편집 대상 문서 ID. 문서를 열지 않았으면 생략한다. 생략하면 baseVersion·editorSnapshot도 함께 생략해야 한다.
          example: doc_1b9f4c7e2a8d4f1e6c3b0a97d25e4f83
        editorSnapshot:
          $ref: "#/components/schemas/EditorSnapshot"
          description: 편집 시작 시점의 에디터 상태. documentId와 함께 생략한다.
        message:
          type: string
          description: 사용자 지시문
          example: 이 문단을 표로 정리해줘
          minLength: 1
        model:
          type: string
          description: 모델명. provider와 짝을 이뤄야 한다.
          example: gpt-5-nano
        provider:
          type: string
          description: LLM provider. model과 짝을 이뤄야 하며 생략하면 설정값을 쓴다.
          enum:
          - openai
          - gemini
          - claude
          example: openai
        session_id:
          type: string
          description: 이 턴을 남길 채팅 세션 ID. 질의와 Agent 요청이 한 세션에 함께 쌓인다.
          example: session_0ff8564ea24047cd8144d3f48badfe3f
          minLength: 1
        skill_draft_excluded_literals:
          type: array
          description: Skill 초안에서 빼야 하는 리터럴 목록
          items:
            type: string
        skill_draft_sources:
          type: array
          description: Skill 초안을 뽑아낼 이전 run 목록(최대 3개)
          items:
            $ref: "#/components/schemas/SkillDraftSourceSelector"
          maxItems: 3
          minItems: 0
        skill_draft_user_directives:
          type: array
          description: Skill 초안에 반영할 사용자 지시 목록
          items:
            type: string
        skill_id:
          type: string
          description: explicit 모드에서 적용할 Skill ID(128자 이하)
          maxLength: 128
          minLength: 0
        skill_mode:
          type: string
          default: auto
          description: "Skill 적용 방식. explicit이면 skill_id가 필수이고, auto·off이면 skill_id를 넣을 수 없다."
          enum:
          - auto
          - explicit
          - "off"
          example: auto
          pattern: auto|explicit|off
        skill_scope_type:
          type: string
          description: Skill을 적용할 범위 종류
      required:
      - message
      - session_id
    AgentTurnResponse:
      type: object
      description: Markdown Agent 편집 턴 결과. apply_operation_id를 뺀 나머지 필드는 camelCase다.
      properties:
        apply_operation_id:
          type: string
          description: 편집안을 적용할 때 저장 요청에 apply_operation_id로 실어야 하는 값. 서버가 발급한 값이라야 AI 작업 로그가 남는다. 문서를 열지 않은 턴은 null이다.
        baseVersion:
          type: integer
          format: int64
          description: 이 턴이 기준으로 삼은 문서 버전. 문서를 열지 않은 턴은 null이다.
          example: 3
        documentId:
          type: string
          description: 대상 문서 ID. 문서를 열지 않은 턴은 null이다.
          example: doc_1b9f4c7e2a8d4f1e6c3b0a97d25e4f83
        error:
          type: string
          description: 실패 사유. 성공이면 null이다.
        requestId:
          type: string
          description: 이 턴의 run ID. 상태 조회에 쓴다.
          example: agent_1b9f4c7e2a8d4f1e6c3b0a97d25e4f83
        result:
          $ref: "#/components/schemas/JsonNode"
          description: 완료된 턴의 편집 제안 결과
        status:
          type: string
          description: 턴 처리 상태
          example: completed
    AiModelSelectionRequest:
      type: object
      description: 설정할 provider와 model 조합. 활성 catalog에 있는 짝만 허용된다.
      properties:
        model:
          type: string
          description: 모델명
          example: gpt-5-nano
          minLength: 1
        provider:
          type: string
          description: LLM provider
          enum:
          - openai
          - gemini
          - claude
          example: openai
          minLength: 1
      required:
      - model
      - provider
    AiModelSelectionResponse:
      type: object
      description: 현재 설정된 provider와 model 조합
      properties:
        model:
          type: string
          description: 모델명
          example: gpt-5-nano
        provider:
          type: string
          description: LLM provider
          enum:
          - openai
          - gemini
          - claude
          example: openai
    BreadcrumbNode:
      type: object
      description: 경로 상의 한 단계
      properties:
        id:
          type: string
          description: "폴더면 UUID, 문서면 doc_ 접두 ID"
        name:
          type: string
          description: 화면에 보여줄 이름
          example: 설계
        type:
          type: string
          description: 항목 종류
          enum:
          - folder
          - document
          example: folder
    BreadcrumbResponse:
      type: object
      properties:
        path:
          type: array
          description: 루트에서 대상까지의 경로. 마지막 원소가 대상 자신이다.
          items:
            $ref: "#/components/schemas/BreadcrumbNode"
    Change:
      type: object
      description: 이 작업이 바꾼 리소스 하나. 값이 없는 필드는 키 자체가 빠진다.
      properties:
        additions:
          type: integer
          format: int32
          description: 추가된 줄 수. 저장 시점에 계산해 둔 값이다.
          example: 12
        after_revision:
          type: integer
          format: int64
          description: 이 작업이 만든 revision. 위임·실패면 null이다.
          example: 3
        before_revision:
          type: integer
          format: int64
          description: 손대기 직전 revision. 새로 만든 것이면 null이다.
          example: 2
        change_summary:
          type: string
          description: 변경 요약
        change_type:
          type: string
          description: 변경 종류
          example: updated
        deletions:
          type: integer
          format: int32
          description: 삭제된 줄 수. 저장 시점에 계산해 둔 값이다.
          example: 4
        diff_too_large:
          type: boolean
          description: 두 본문 차이가 너무 커서 계산하지 못한 경우 true. 개별 diff로도 볼 수 없다.
          example: true
        hunks:
          type: array
          description: 실제 변경분. 비교할 짝이 없거나 계산이 거부되면 키가 빠진다.
          items:
            $ref: "#/components/schemas/Hunk"
        id:
          type: integer
          format: int64
          description: 변경 내역 ID
          example: 1
        page_type:
          type: string
          description: ingest·lint Wiki의 유형. 페이지 메타데이터가 없으면 생략된다.
          enum:
          - concept
          - source
        resource_display_name:
          type: string
          description: 변경 시점의 리소스 표시 이름
        resource_id:
          type: string
          description: 바뀐 리소스 ID
        resource_type:
          type: string
          description: 바뀐 리소스 종류
          example: wiki_page
    ChatMessageReference:
      type: object
      description: 답변의 근거가 된 원문 참조. 값이 없는 필드는 키 자체가 빠진다.
      properties:
        id:
          type: integer
          format: int64
          description: 참조 ID
          example: 1
        rank:
          type: integer
          format: int32
          description: 근거 순위(0부터). 낮을수록 강한 근거다.
          example: 0
        reference_type:
          type: string
          description: 참조 종류
        source_block_ids:
          type: array
          description: 근거가 된 원문 block ID 목록
          items:
            type: string
        source_document_id:
          type: string
          description: 근거가 된 원본 문서 ID
          example: doc_1b9f4c7e2a8d4f1e6c3b0a97d25e4f83
        source_refs:
          type: array
