          example: openai
        references:
          type: array
          description: 답변의 근거가 된 원문 참조 목록
          items:
            $ref: "#/components/schemas/ChatMessageReference"
        related_pages:
          type: array
          description: 답변과 관련된 Wiki 페이지 목록
          items:
            $ref: "#/components/schemas/ChatMessageRelatedPageResponse"
        role:
          type: string
          description: 발화 주체
          enum:
          - user
          - assistant
          example: assistant
        run_id:
          type: string
