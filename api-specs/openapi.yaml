openapi: 3.1.0
info:
  contact:
    name: Fruition
  description: Fruition PoC 백엔드 API
  title: Fruition API
  version: 0.0.1
security:
- bearerAuth: []
tags:
- description: 선택 가능한 AI 모델 카탈로그와 워크스페이스 모델 설정 API
  name: AI Models
- description: AI가 문서·Wiki를 바꾼 이력을 조회하고 복구를 미리 확인합니다.
  name: AI Operation Logs
- description: 워크스페이스 문맥에서 Agent 실행을 관리하는 API
  name: Agent
- description: 채팅 세션 및 메시지 기록 API
  name: Chat Sessions
- description: Markdown 문서 이미지 asset 조회 API
  name: Document Assets
- description: 문서 편집 잠금(활성 편집 추적) API
  name: Document Edit Lock
- description: Markdown 편집 문서와 업로드 원본 관리 API
  name: Documents
- description: 문서 위치와 폴더 배치 관리 API
  name: Documents
- description: "워크스페이스 문서 폴더의 생성, 이동, 삭제 및 복구 API"
  name: Folders
- description: 워크스페이스 문서·폴더 계층 탐색 API
  name: Navigation
- description: 워크스페이스 문서와 폴더 계층 탐색 API
  name: Navigation
- description: Wiki 기반 자연어 질의 API
  name: Query
- description: 비동기 질의 실행 상태와 실시간 진행 이벤트 API
  name: Query Runs
- description: "재사용 가능한 Agent Skill 작성, 게시 및 실행 설정 API"
  name: Skills
- description: Wiki 그래프 및 페이지 조회 API
  name: Wiki
- description: Wiki 정합성 검사와 유지보수 실행 API
  name: Wiki Maintenance
- description: "Wiki 생성 규칙의 미리보기, 초안 저장 및 활성화 API"
  name: Wiki Schema
paths:
  /api/ai-models:
    get:
      description: 선택할 수 있는 provider/model 조합을 반환합니다. API key는 노출하지 않습니다.
      operationId: list_4
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ModelsResponse"
          description: 조회 성공
      summary: AI 모델 카탈로그 조회
      tags:
      - AI Models
  /api/query/runs/{requestId}:
    get:
      description: 비동기 질의의 현재 상태와 완료 결과 또는 오류 정보를 반환합니다.
      operationId: getRun_1
      parameters:
      - description: 비동기 질의 요청 ID
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QueryRunStatusResponse"
          description: 상태 조회 성공
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 질의 실행 또는 워크스페이스를 찾을 수 없음
      summary: 질의 실행 상태 조회
      tags:
      - Query Runs
  /api/query/runs/{requestId}/events:
    get:
      description: 비동기 질의의 진행 상황과 최종 결과를 Server-Sent Events로 전달합니다.
      operationId: subscribe
      parameters:
      - description: 비동기 질의 요청 ID
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE 구독 시작
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 질의 실행 또는 워크스페이스를 찾을 수 없음
      summary: 질의 진행 이벤트 구독
      tags:
      - Query Runs
  /api/workspaces/{workspaceId}/ai/tasks/{id}:
    get:
      operationId: status_1
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
          description: OK
      tags:
      - ai-task-cancellation-controller
  /api/workspaces/{workspaceId}/ai/tasks/{id}/cancel:
    post:
      operationId: cancel_1
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
          description: OK
      tags:
      - ai-task-cancellation-controller
  /api/workspaces/{workspace_id}/agent/runs/{run_id}:
    get:
      description: 자율 AgentRun 계획과 실행 상태를 조회합니다.
      operationId: getRun
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: OK
      summary: AgentRun 조회
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/runs/{run_id}/approve:
    post:
      description: 현재 AgentRun 계획을 승인합니다.
      operationId: approve
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunApproveRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: OK
      summary: AgentRun 승인
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/runs/{run_id}/cancel:
    post:
      description: 현재 AgentRun을 취소합니다.
      operationId: cancel
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: OK
      summary: AgentRun 취소
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/runs/{run_id}/reject:
    post:
      description: 현재 AgentRun 계획을 거절합니다.
      operationId: reject
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: OK
      summary: AgentRun 거절
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/runs/{run_id}/revise:
    post:
      description: 현재 AgentRun에 새 계획을 요청합니다.
      operationId: revise
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunReviseRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: OK
      summary: AgentRun 계획 수정
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/turn:
    post:
      description: 사용자 요청을 비동기 Agent 실행 대기열에 등록합니다.
      operationId: turn
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTurnRequest"
        required: true
      responses:
        "202":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentTurnResponse"
          description: Agent 실행이 대기열에 등록됨
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 잘못된 요청
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 문서 또는 워크스페이스를 찾을 수 없음
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 문서 version 충돌
        "423":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 다른 사용자가 문서를 편집 중
      summary: Agent turn 실행
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/turn/{run_id}:
    get:
      description: 워크스페이스의 Agent 실행 결과를 조회합니다.
      operationId: getTurn
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - description: 조회할 Agent 실행 ID
        in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentTurnResponse"
          description: 결과 조회 성공
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Agent run ID 형식이 올바르지 않음
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실행 또는 워크스페이스를 찾을 수 없음
        "503":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/JsonNode"
                - $ref: "#/components/schemas/ErrorResponse"
          description: Agent 상태 파이프라인 사용 불가
      summary: Agent turn 결과 조회
      tags:
      - Agent
  /api/workspaces/{workspace_id}/agent/turn/{run_id}/events:
    get:
      description: "Agent turn의 진행 상황과 최종 결과를 Server-Sent Events로 전달합니다. AI가 질의로 판정한 턴만 단계 이벤트를 내며, 편집·Skill 갈래는 완료 이벤트만 옵니다."
      operationId: subscribeTurnEvents
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - description: 구독할 Agent 실행 ID
        in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE 구독 시작
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Agent run ID 형식이 올바르지 않음
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 실행 또는 워크스페이스를 찾을 수 없음
      summary: Agent turn 진행 이벤트 구독
      tags:
      - Agent
  /api/workspaces/{workspace_id}/ai-model-settings:
    get:
      description: ingest·lint 작업에 쓰는 provider/model 설정을 반환합니다. OWNER와 MEMBER 모두 조회할 수 있습니다.
      operationId: get
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsResponse"
          description: 조회 성공
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 워크스페이스를 찾을 수 없음
      summary: 워크스페이스 AI 모델 설정 조회
      tags:
      - AI Models
    put:
      description: "ingest·lint에 쓸 provider/model을 바꿉니다. OWNER만 호출할 수 있고, 활성 model catalog에 있는 조합만 허용합니다."
      operationId: update
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsResponse"
          description: 변경 성공
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: catalog에 없는 provider/model 조합
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: OWNER가 아님
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 워크스페이스를 찾을 수 없음
      summary: 워크스페이스 AI 모델 설정 변경
      tags:
      - AI Models
  /api/workspaces/{workspace_id}/ai-operation-logs:
    get:
      description: "최신순으로 반환합니다. 바꾼 것이 없는 성공 작업은 제외하고, 문서 편집은 실제 변경에 성공한 작업만 포함하며, status를 생략하면 진행 중인 작업과 반영에 실패한 작업은 제외합니다. status=processing 명시 조회는 활성 작업 탐지에, status=failed와 status=conflict 명시 조회는 실패 감지에 사용할 수 있습니다. 로그 테이블만 읽고 diff를 계산하지 않습니다."
      operationId: list_3
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - description: 작업 유형
        example: ingest
        in: query
        name: type
        required: false
        schema:
          type: string
      - description: 상태
        example: succeeded
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: 이전 응답의 next_cursor
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "페이지 크기. 기본 20, 최대 100"
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OperationLogListResponse"
          description: 조회 성공
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 워크스페이스를 찾을 수 없음
      summary: AI 작업 로그 목록
      tags:
      - AI Operation Logs
  /api/workspaces/{workspace_id}/ai-operation-logs/{operation_id}:
    get:
      description: ingest·lint는 생성·삭제된 Wiki의 제목과 page_type(concept/source)을 반환하며 본문·diff는 계산하거나 전달하지 않습니다. 그 외 작업은 리소스별 변경분을 반환합니다.
      operationId: detail
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - description: 작업 식별자
        example: op_a2_7f3c9
        in: path
        name: operation_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OperationLogDetailResponse"
          description: 조회 성공
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 작업 또는 워크스페이스를 찾을 수 없음
      summary: AI 작업 로그 상세
      tags:
      - AI Operation Logs
  /api/workspaces/{workspace_id}/ai-operation-logs/{operation_id}/restore:
    post:
      description: "복구 대상에 따라 처리 방식이 다릅니다. 문서 편집 복구는 즉시 완료되어 200을 반환하고, Wiki 복구는 queued 상태로 등록되어 202를 반환합니다. 미리보기와 같은 계산을 다시 하고 Wiki에 반영합니다. 받치는 기여가 남지 않은 페이지는 삭제합니다. Source는 마지막 남은 ingest의 본문으로 복원하고, Concept는 과거 버전 유무와 관계없이 남은 활성 기여를 llmPipeline에 전달해 재작성합니다. 재작성이 있으면 status가 rebuilding으로 돌아오며 결과는 로그 상세로 확인합니다. ingest 되돌리기는 Wiki만 되돌리고 원문 문서는 건드리지 않습니다."
      operationId: restore_2
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: path
        name: operation_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreExecuteRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RestoreExecuteResponse"
          description: 문서 편집 복구 즉시 완료
        "202":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RestoreExecuteResponse"
          description: Wiki 복구 queued 등록
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 되돌릴 수 없는 작업이거나 대상이 없음
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 작업 또는 워크스페이스를 찾을 수 없음
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 미리보기 이후 대상이 변경됨
