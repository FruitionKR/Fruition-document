spring.application.name=document-svc

# 운영 기본 로그는 경계와 상태 변화(INFO)만 출력한다. 내부 처리 단계는 local에서 DEBUG로 연다.
logging.level.fruition=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [requestId=%X{requestId:--} userId=%X{userId:--} flowId=%X{flowId:--}] %logger{36} - %msg%n

# Actuator — 관리 엔드포인트를 업무 포트에서 분리한다.
# ALB Ingress(k8s/overlays/aws/ingress.yaml)가 업무 포트만 라우팅하므로,
# 분리해두면 /actuator/prometheus가 인터넷에 노출되지 않는다.
# k8s에서는 configmap의 MANAGEMENT_PORT가 두 서비스를 같은 번호로 덮는다
# (ALB healthcheck-port 주석이 Ingress 단위라 서비스별로 다른 번호를 줄 수 없다).
management.server.port=${MANAGEMENT_PORT:8082}
management.endpoints.web.exposure.include=health,prometheus
# HTTP 응답 시간 백분위(p95 등)를 쓰려면 히스토그램 버킷이 필요하다.
# 관측 범위는 기본값(1ms~30s)을 쓴다. 로컬 응답이 1ms대라 하한을 올리면 p95가
# 첫 버킷 보간값으로 뭉개지고, 동기 외부 호출은 10초를 넘길 수 있어 상한도 못 좁힌다.
# 대신 endpoint 조합 하나당 시계열이 69개 늘어난다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# 모든 지표에 붙는 공통 태그. Spring Boot는 application 태그를 자동으로 붙이지 않는데,
# Grafana JVM 대시보드(4701)를 비롯한 표준 대시보드가 이 라벨로 서비스를 구분한다.
management.metrics.tags.application=${spring.application.name}

# DataSource — core 전용 DB(core_db). 런타임은 DML만 가능한 runtime 계정을 쓴다.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CORE_DB_NAME:core_db}?sslmode=${PGSSLMODE:prefer}
spring.datasource.username=${CORE_DB_RUNTIME_USER:core_runtime}
spring.datasource.password=${CORE_DB_RUNTIME_PASSWORD:core_runtime_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# 편집 저장 outbox event를 발행할 Kafka topic
app.document-edit.event-topic=${DOCUMENT_EDIT_EVENT_TOPIC:document.edit.event}

# MinIO
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:fruition}
app.storage.secret-key=${S3_SECRET_KEY:fruition_dev_secret}
app.storage.bucket=${S3_BUCKET:fruition-storage}

# File Upload
spring.servlet.multipart.max-file-size=50MB
# 이미지 포함 저장의 합계 한도(100MB)를 코드에서 검사해 413으로 안내하려면
# multipart 한도가 그보다 커야 한다. Markdown 5MB와 multipart 부가 데이터를 더해 110MB로 둔다.
spring.servlet.multipart.max-request-size=110MB

# 문서 편집 잠금(lease) TTL(초). heartbeat 없이 이 시간이 지나면 잠금이 만료된다. 프론트 heartbeat 주기는 TTL의 1/3 권장.
app.document.edit-lock.ttl-seconds=${DOCUMENT_EDIT_LOCK_TTL_SECONDS:45}

# JPA
# 스키마는 Flyway가 단일 소스로 관리한다. 앱은 검증만 수행(validate).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
# 이미 데이터가 있는 기존 DB(운영/공유)는 V1을 재실행하지 않고 v1로 마킹만 한 뒤 V2부터 적용.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# DDL은 스키마 소유 계정(migration)으로만 실행한다. runtime 계정은 DML 전용.
spring.flyway.user=${CORE_DB_MIGRATION_USER:core_migration}
spring.flyway.password=${CORE_DB_MIGRATION_PASSWORD:core_migration_dev_password}

# Processing — ingest command는 Kafka로 ai-svc worker에 전달한다
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
app.processing.command-topic=${INGEST_COMMAND_TOPIC:ai.ingest.command}
app.query.command-topic=${QUERY_COMMAND_TOPIC:ai.query.command}
app.ai-task.result-topic=${AI_TASK_EVENT_TOPIC:ai.task.event}
app.ai-task.result-consumer-group=${AI_TASK_RESULT_CONSUMER_GROUP:document-svc-ai-task-result}
app.ai-command.outbox-poll-interval-ms=${AI_COMMAND_OUTBOX_POLL_INTERVAL_MS:1000}
app.pipeline-run.endpoint=${PROCESSING_ENDPOINT:http://localhost:8000/pipeline/runs}
app.pipeline-run.timeout-seconds=${PIPELINE_RUN_TIMEOUT_SECONDS:5}
app.pipeline-run.poll-interval-ms=${PIPELINE_RUN_POLL_INTERVAL_MS:3000}

# Query (FastAPI Pipeline)
app.query.endpoint=${QUERY_ENDPOINT:http://localhost:8000/query}
app.query.timeout-seconds=${QUERY_TIMEOUT_SECONDS:30}
app.ai.enabled-providers=openai,gemini,claude

# Agent Markdown edit (Kafka)
app.agent.command-topic=${AGENT_COMMAND_TOPIC:ai.agent.command}
app.agent.status-endpoint=${AGENT_STATUS_ENDPOINT:http://localhost:8000/internal/agent/runs}
app.agent.run-endpoint=${AGENT_RUN_ENDPOINT:http://localhost:8000/agent/runs}
app.agent.status-timeout-seconds=${AGENT_STATUS_TIMEOUT_SECONDS:5}

# Wiki schema (FastAPI Pipeline)
app.wiki-schema.endpoint=${WIKI_SCHEMA_ENDPOINT:http://localhost:8000/wiki-schema}
app.wiki-schema.timeout-seconds=${WIKI_SCHEMA_TIMEOUT_SECONDS:60}

# Skill 관리 (FastAPI Pipeline)
app.skill.endpoint=${SKILL_ENDPOINT:http://localhost:8000/skills}
app.skill.agent-token=${AGENT_INTERNAL_TOKEN}
app.skill.timeout-seconds=${SKILL_TIMEOUT_SECONDS:60}

# 회의 실시간 받아쓰기: ai-svc WebSocket 주소. X-Internal-Token(app.internal.callback-token)을 함께 보낸다.
app.speech.live-endpoint=${SPEECH_LIVE_ENDPOINT:ws://localhost:8000/speech/transcriptions/live}
# 파일 전사: ai-svc 파일 전사 주소. 채팅 음성 입력과 녹음 파일 회의 전사가 같이 쓴다. AI가 모델 호출에 최대 120초를 쓴다.
app.speech.transcription-endpoint=${SPEECH_TRANSCRIPTION_ENDPOINT:http://localhost:8000/speech/transcriptions}
app.speech.transcription-timeout-seconds=${SPEECH_TRANSCRIPTION_TIMEOUT_SECONDS:150}
# 회의록 초안: ai-svc 회의록 API. AI가 모델 호출에 최대 120초를 쓰므로 그보다 길게 기다린다.
app.speech.meeting-notes-endpoint=${MEETING_NOTES_ENDPOINT:http://localhost:8000/meeting-notes/preview}
app.speech.meeting-notes-timeout-seconds=${MEETING_NOTES_TIMEOUT_SECONDS:270}

# 서비스 간 내부 API 토큰. 사용자 인증과 분리한다.
app.internal.callback-token=${INTERNAL_CALLBACK_TOKEN}
# core(문서 서비스)가 access 내부 조회 API(/internal/**)를 호출할 기본 주소. access-svc는 8081에서 뜬다.
app.internal.access-base-url=${ACCESS_INTERNAL_BASE_URL:http://localhost:8081}
# 복구 미리보기 토큰 서명 키. 비우면 인스턴스마다 임의 키를 만들어, 다중 인스턴스에서는 서로 검증하지 못한다.
app.restore.preview-token-secret=${RESTORE_PREVIEW_TOKEN_SECRET:}

app.maintenance.command-topic=${MAINTENANCE_COMMAND_TOPIC:ai.maintenance.command}
app.wiki-page.endpoint=${WIKI_PAGE_ENDPOINT:http://localhost:8000/wiki/pages}
app.wiki-page.timeout-seconds=${WIKI_PAGE_TIMEOUT_SECONDS:30}
app.wiki-state.endpoint=${WIKI_STATE_ENDPOINT:http://localhost:8000/wiki}
app.wiki-state.timeout-seconds=${WIKI_STATE_TIMEOUT_SECONDS:30}

# PDF → Markdown 변환기(converter, 내부 전용). OCR이 오래 걸릴 수 있어 client read timeout은 900초다.
# 로컬 호스트 bootRun은 compose.converter.yml이 여는 127.0.0.1:8010을 쓴다.
app.internal.converter-base-url=${CONVERTER_ENDPOINT:http://localhost:8010}


# JWT
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-please-32bytes-min}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
app.jwt.issuer=${JWT_ISSUER:fruition-access}
app.jwt.audience=${JWT_AUDIENCE:fruition-api}

# Redis (다중 인스턴스 공유 store: OAuth 교환 코드, query run 상태·SSE 이벤트 중계)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Lettuce 기본 60s는 Redis 장애 시 요청이 1분씩 매달리므로 짧게 fail-fast 한다.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}

# 프론트엔드가 /api/** 를 fetch/XHR로 호출할 수 있도록 허용할 origin (콤마로 구분)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger / SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# 명세를 파일로 커밋하므로 키 순서를 고정한다 — 순서가 흔들리면 diff가 계약 변경을 못 드러낸다.
springdoc.writer-with-order-by-keys=true

# AWS는 서비스별 Redis ACL 인증과 TLS를 사용한다.
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
app.storage.credentials-mode=${S3_CREDENTIALS_MODE:local}
app.storage.region=${AWS_REGION:}

app.model-usage.endpoint=${MODEL_USAGE_ENDPOINT:http://localhost:8000/usage/models}
# 호출 단위 청구(#78). AI 원장의 호출 단위 조회 내부 API와 수집 주기.
app.usage-charge.calls-endpoint=${MODEL_USAGE_CALLS_ENDPOINT:http://localhost:8000/internal/model-usage/calls}
app.usage-charge.collect-interval-ms=${USAGE_CHARGE_COLLECT_INTERVAL_MS:5000}
app.usage-charge.reconcile-interval-ms=${USAGE_CHARGE_RECONCILE_INTERVAL_MS:86400000}
app.usage-charge.recompute-interval-ms=${USAGE_CHARGE_RECOMPUTE_INTERVAL_MS:3600000}
# 선불 크레딧(#79). enforce가 false면 잔액이 모자라도 거절하지 않고 예약·정산만 기록한다(무료 크레딧 정책 전 배포용).
# 예상 상한은 milli-KRW(1000 = 1원)이며 kind별 값이 없으면 기본값을 쓴다. 실제 분포를 보고 조정한다.
app.billing.enforce=${BILLING_ENFORCE:false}
app.billing.default-estimate-krw-milli=${BILLING_DEFAULT_ESTIMATE_KRW_MILLI:500000}
app.billing.estimate.query=${BILLING_ESTIMATE_QUERY:300000}
app.billing.estimate.agent=${BILLING_ESTIMATE_AGENT:500000}
app.billing.estimate.document=${BILLING_ESTIMATE_DOCUMENT:1000000}
app.billing.estimate.meeting_notes=${BILLING_ESTIMATE_MEETING_NOTES:500000}
app.billing.estimate.meeting_transcription=${BILLING_ESTIMATE_MEETING_TRANSCRIPTION:1000000}
app.billing.estimate.meeting_live=${BILLING_ESTIMATE_MEETING_LIVE:1000000}
app.billing.estimate.speech_transcription=${BILLING_ESTIMATE_SPEECH_TRANSCRIPTION:100000}
app.billing.stale-reservation-hours=${BILLING_STALE_RESERVATION_HOURS:48}
app.billing.release-interval-ms=${BILLING_RELEASE_INTERVAL_MS:3600000}
# 실시간 전사는 이 간격마다 그때까지의 사용량을 차감하고 다음 구간을 다시 예약한다(enforce면 잔액 부족 시 연결 종료).
app.billing.live-renew-seconds=${BILLING_LIVE_RENEW_SECONDS:60}
# PG 결제 충전·환불(#80, ADR-0026). PG를 정하기 전에는 꺼 둔다(false면 주문·webhook API 404).
# 요청 형식은 토스페이먼츠 승인·취소 API 기준이며 PG 선정 후 맞춘다. 상품의 금액(원)과 지급 크레딧(milli-KRW)은 이 표로만 정한다.
app.billing.payments-enabled=${BILLING_PAYMENTS_ENABLED:false}
app.billing.pg.confirm-endpoint=${PG_CONFIRM_ENDPOINT:https://api.tosspayments.com/v1/payments/confirm}
app.billing.pg.payment-endpoint=${PG_PAYMENT_ENDPOINT:https://api.tosspayments.com/v1/payments/{paymentKey}}
app.billing.pg.cancel-endpoint=${PG_CANCEL_ENDPOINT:https://api.tosspayments.com/v1/payments/{paymentKey}/cancel}
app.billing.pg.secret-key=${PG_SECRET_KEY:}
app.billing.pg.webhook-secret=${PG_WEBHOOK_SECRET:}
app.billing.product.CREDIT_10000.amount-krw=10000
app.billing.product.CREDIT_10000.credit-krw-milli=10000000
app.billing.product.CREDIT_30000.amount-krw=30000
app.billing.product.CREDIT_30000.credit-krw-milli=30000000
app.billing.product.CREDIT_50000.amount-krw=50000
app.billing.product.CREDIT_50000.credit-krw-milli=50000000
