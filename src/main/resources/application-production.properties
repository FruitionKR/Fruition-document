# AWS에서는 별도 migration Job을 먼저 실행하고 runtime은 스키마 검증만 한다.
spring.flyway.enabled=false
spring.datasource.password=${CORE_DB_RUNTIME_PASSWORD}
# 운영(SPRING_PROFILES_ACTIVE=production) Pod당 DB 연결 상한. 기본 10이면 Pod가 늘 때 RDS 연결 수가 함께 커진다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
