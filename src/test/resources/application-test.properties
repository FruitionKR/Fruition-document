# Only loaded by the test JVM; production/local application defaults remain unchanged.
# Never fall back to a developer's running broker or service. Tests exercising network
# behavior must supply their own mock server/container via @DynamicPropertySource or
# @SpringBootTest(properties=...). Keep schedulers and application beans enabled.
spring.kafka.bootstrap-servers=127.0.0.1:1
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
# Unmocked scheduled outbox sends fail quickly instead of blocking shutdown for 60s.
spring.kafka.producer.properties.max.block.ms=100

# Missing container wiring must fail closed rather than use a developer database/storage.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/test
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
app.storage.endpoint=http://127.0.0.1:1
app.storage.credentials-mode=local

app.internal.access-base-url=http://127.0.0.1:1
app.pipeline-run.endpoint=http://127.0.0.1:1/pipeline/runs
app.query.endpoint=http://127.0.0.1:1/query
app.agent.status-endpoint=http://127.0.0.1:1/internal/agent/runs
app.agent.run-endpoint=http://127.0.0.1:1/agent/runs
app.skill.endpoint=http://127.0.0.1:1/skills
app.speech.live-endpoint=ws://127.0.0.1:1/speech/transcriptions/live
app.speech.transcription-endpoint=http://127.0.0.1:1/speech/transcriptions
app.speech.synthesis-endpoint=http://127.0.0.1:1/speech/synthesis
app.wiki-state.endpoint=http://127.0.0.1:1/wiki
app.model-usage.endpoint=http://127.0.0.1:1/usage/models
app.usage-charge.calls-endpoint=http://127.0.0.1:1/internal/model-usage/calls
app.fx.koreaexim.endpoint=http://127.0.0.1:1/exchange
app.fx.koreaexim.auth-key=
