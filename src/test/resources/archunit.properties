freeze.store.default.path=src/test/resources/archunit_store
# store 폴더가 없을 때 새로 만들지 않는다.
freeze.store.default.allowStoreCreation=false
# CI에서 store를 바꾸지 않는다: 새 위반, store에 없는 freeze 규칙, 위반 감소 모두 실패한다.
# 규칙을 추가하거나 위반을 고쳤으면 로컬에서 잠시 true로 두고 테스트를 한 번 돌린 뒤 되돌리고 바뀐 store를 커밋한다.
freeze.store.default.allowStoreUpdate=false
