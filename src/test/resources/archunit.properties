freeze.store.default.path=src/test/resources/archunit_store
# store 폴더가 없을 때 새로 만들지 않는다.
freeze.store.default.allowStoreCreation=false
# CI에서 store를 바꾸지 않는다: 새 위반, store에 없는 freeze 규칙, 위반 감소 모두 실패한다.
freeze.store.default.allowStoreUpdate=false
# 갱신 절차(규칙 추가·변경, 위반 수정 시): 아래 refreeze와 위 allowStoreUpdate를 잠시 true로 두고
# ./gradlew test --tests fruition.ArchitectureRulesTest 를 한 번 돌린 뒤 되돌리고 store diff를 커밋한다.
# (allowStoreUpdate만 켜면 새로 생긴 줄은 여전히 새 위반으로 실패한다. refreeze가 현재 위반 전체를 다시 기록한다.)
freeze.refreeze=false
